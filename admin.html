<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack : catalogue de films et séries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class=" bg-black">
    <header class="mx-auto flex flex-wrap items-center sm:flex-row sm:items-center border-b-4 sm:justify-between gap-2">
        <div class="ml-2 items-center mt-5 mb-5 flex italic">
            <img src="./img/images-removebg-preview.png" alt="video image" class="h-14 sm:h-20">
            <strong><span class="text-amber-50 text-3xl sm:text-5xl">Ciné</span><span class="text-red-500 text-3xl sm:text-5xl">Track</span></strong>
        </div>
        <div>
        <span class="font-bold border border-red-400 bg-amber-700 rounded text-2xl text-amber-50">Admin</span>
        <a href="index.html" class="text-2xl border bg-amber-50 rounded font-bold">Catalogue</a>
        </div>    
    </header>
    <main>

        <section class="m-4 p-4 rounded bg-slate-800 border border-gray-700">
            <h2 id="form-title" class="text-xl font-bold text-amber-50 mb-4">Ajouter un titre</h2>

            <form id="content-form" class="grid md:grid-cols-2 gap-4">
                <div>
                    <label for="title" class="block text-amber-50 mb-1">Titre</label>
                    <input id="title" type="text" class="w-full rounded-lg border h-[50%] border-slate-500 bg-slate-900 px-3 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <p id="error-title" class="error text-red-400 text-sm mt-1"></p>
                    </div>

                    <div>
                        <label for="type" class="block text-amber-50 mb-1">Type</label>
                        <select id="type" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                            <option value="">-- Choisir --</option>
                            <option value="movie">Film</option>
                            <option value="series">Series</option>
                            </select>
                            <p id="error-type" class="error text-red-400 text-sm mt-1"></p>
                            </div>
                            <div>
                            <label for="year" class="block text-amber-50 mb-1">Annee de sortie</label>
                            <input type="number" id="year" class="w-full rounded-lg border h-[70%] border-slate-500 bg-slate-900 px-3 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                            <p id="error-year" class="error text-red-400 text-sm mt-1"></p>
                            </div>

                            <div id="duration-box" class="hidden">
                                <label for="duration" class="block text-amber-50 mb-1">Duree(minutes)</label>
                                <input type="number" name="duration" id="duration" class="w-full h-[70%] rounded-lg border border-slate-500 bg-slate-900 px-3 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                <p id="error-duration" class="error text-rose-400 text-sm mt-1"></p>
                            </div>

                            <div id="seasons-box" class="hidden">
                                <label for="seasons" class="block text-amber-50 mb-1">Nombre de saisons</label>
                                <input type="number" name="seasons" id="seasons" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:right-2 focus:ring-blue-600">
                                <p id="error-seasons" class="text-red-400 text-sm mt-1"></p>
                            </div>

                            <div class="md:col-span-2">
                                <label for="image" class="block text-amber-50 mb-1">URL de l'image</label>
                                <input type="text" id="image" placeholder="https://..." class="w-full rounded-lg border h-[70%] border-slate-500 bg-slate-900 px-3 py2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                <p id="error-image" class="text-red-400 text-sm mt-1"></p>

                                <img id="preview" src="" alt="Apercu" class="hidden mt-2 h-28 rounded object-cover">
                                </div>

                                <div>
                                    <label for="genres" class="block text-amber-50 mb-1">Genre (separe par des virgules)</label>
                                     <input id="genres" type="text" placeholder="Drama, Crime" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                    </div>
                                    
                                    <div>
                                        <label for="directors" class="block text-amber-50 mb-1">Réalisateurs (séparés par des virgules)</label>
                                        <input id="directors" type="text" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                    </div>

                                    <div class="md:col-span-2">
                                        <label for="countries" class="block text-amber-50 mb-1">Pays de production (séparés par des virgules)</label>
                                        <input id="countries" type="text" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label for="description" class="block text-amber-50 mb-1">Description</label>
                                        <textarea id="description" rows="3" class="w-full rounded-lg border border-slate-500 bg-slate-900 px-3 py-2 text-amber-50 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
                                    </div>
                                    <div class="md:col-span-2 flex gap-3">
                                        <button id="submit-btn" type="submit" class="px-5 py-2 rounded-lg bg-red-600 hover:bg-red-700 text-white font-semibold">Ajouter</button>
                                        <button id="cancel-btn" type="button" class="hidden px-5 py-2 rounded-lg bg-white text-black font-semibold hover:bg-slate-300">Annuler</button>
                                    </div>
                                </form>
                            </section>
                            
                            <p id="message" class="hidden"></p>
                            <p id="loader" class="p-4 text-amber-50">Chargement…</p>
                            <div>
                                <table class="w-full text-left border bg-slate-800 border-gray-700 ">
                                    <thead>
                                        <tr>
                                            <th class="p-3 italic text-amber-50 ">Image</th>
                                            <th class="p-3 italic text-amber-50">Titre</th>
                                            <th class="p-3 italic text-amber-50">Type</th>
                                            <th class="p-3 italic text-amber-50">Année</th>
                                            <th class="p-3 italic text-amber-50">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tabl-film"></tbody>
                                </table>
                            </div>
                        </main>
                        <script type="module" src="./js/admin.js"></script>
                    </body>
                    </html>
