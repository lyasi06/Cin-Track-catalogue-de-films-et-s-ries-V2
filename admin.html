<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinéTrack : catalogue de films et séries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body class=" bg-black">
    <header class="mx-auto flex flex-wrap items-center sm:flex-row sm:items-center border-b-4 sm:justify-between gap-2">
        <div class="ml-2 items-center mt-5 mb-5 flex italic">
            <img src="./img/images-removebg-preview.png" alt="video image" class="h-14 sm:h-20">
            <strong><span class="text-amber-50 text-3xl sm:text-5xl">Ciné</span><span class="text-red-500 text-3xl sm:text-5xl">Track</span></strong>
        </div>
        <div>
        <span class="font-bold border border-red-400 bg-amber-700 rounded text-2xl text-amber-50">Admin</span>
        <a href="index.html" class="text-2xl border bg-amber-50 rounded font-bold">Catalogue</a>
        </div>    
    </header>
    aside
    <main>
        <p id="message" class="hidden"></p>
        <p id="loader" class="p-4 text-amber-50">Chargement…</p>
        <div >
            <table class="w-full text-left border bg-slate-800 border-gray-700 ">
                <thead>
                    <tr>
                        <th class="p-3 italic text-amber-50 ">Image</th>
                        <th class="p-3 italic text-amber-50">Titre</th>
                        <th class="p-3 italic text-amber-50">Type</th>
                        <th class="p-3 italic text-amber-50">Année</th>
                        <th class="p-3 italic text-amber-50">Action</th>
                    </tr>
                </thead>
                <tbody id="tabl-film"></tbody>
            </table>
        </div>
    </main>
        <script type="module" src="./js/admin.js"></script>
</body>
</html>
